<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windmill AC</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
    --accent:#2a78d6; --accent-wash:rgba(42,120,214,0.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface-1:#1a1a19;
      --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
      --accent:#3987e5; --accent-wash:rgba(57,135,229,0.16);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s5:#d55181; --s6:#008300; --s7:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19;
    --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --accent:#3987e5; --accent-wash:rgba(57,135,229,0.16);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9;
  }

  * { box-sizing:border-box; }
  body { margin:0; padding:26px 20px 64px; background:var(--page); color:var(--text-primary);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:1120px; margin:0 auto; }

  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  h1 { font-size:21px; font-weight:620; margin:0; letter-spacing:-.01em; }
  .meta { color:var(--text-muted); font-size:13px; margin-left:auto; }
  .dot { width:7px; height:7px; border-radius:50%; background:#0ca30c; display:inline-block; }

  h2 { font-size:13px; font-weight:600; letter-spacing:.02em; text-transform:uppercase;
       color:var(--text-secondary); margin:0 0 4px; }
  .sub { font-size:12.5px; color:var(--text-muted); margin:0 0 16px; }
  section { background:var(--surface-1); border:1px solid var(--border); border-radius:12px;
            padding:20px; margin-bottom:18px; }

  /* toolbar */
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  .presets { display:flex; flex-wrap:wrap; gap:2px; background:var(--border);
             border:1px solid var(--border); border-radius:9px; overflow:hidden; }
  .presets button { border:0; background:var(--surface-1); color:var(--text-secondary);
    padding:7px 13px; font:inherit; font-size:13px; cursor:pointer; }
  .presets button:hover { background:var(--accent-wash); color:var(--text-primary); }
  .presets button[aria-pressed="true"] { background:var(--accent); color:#fff; font-weight:560; }
  .field { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); }
  input[type=date], input[type=number] { font:inherit; font-size:13px; padding:6px 9px;
    border:1px solid var(--border); border-radius:8px; background:var(--surface-1);
    color:var(--text-primary); }
  input[type=number] { width:86px; font-variant-numeric:tabular-nums; }
  .ghost { border:1px solid var(--border); background:var(--surface-1); color:var(--text-secondary);
    border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .ghost:hover { background:var(--accent-wash); color:var(--text-primary); }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:2px;
           background:var(--border); border:1px solid var(--border); border-radius:12px;
           overflow:hidden; margin-bottom:18px; }
  .stat { background:var(--surface-1); padding:18px 20px; }
  .stat .k { font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .stat .v { font-size:27px; font-weight:600; letter-spacing:-.02em; line-height:1.1; }
  .stat .u { font-size:14px; font-weight:500; color:var(--text-secondary); margin-left:3px; }
  .stat .n { font-size:12px; color:var(--text-muted); margin-top:5px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:12px; }
  .card { border:1px solid var(--border); border-radius:10px; padding:14px 15px; }
  .card .top { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .swatch { width:9px; height:9px; border-radius:2px; flex:none; }
  .card .nm { font-weight:580; font-size:14.5px; }
  .pill { margin-left:auto; font-size:11px; padding:2px 7px; border-radius:20px;
          border:1px solid var(--border); color:var(--text-secondary); white-space:nowrap; }
  .temps { display:flex; align-items:baseline; gap:6px; margin-bottom:12px; }
  .temps .now { font-size:30px; font-weight:600; letter-spacing:-.02em; }
  .temps .tgt { font-size:13px; color:var(--text-muted); }
  .rows { font-size:13px; }
  .row { display:flex; justify-content:space-between; padding:3px 0; }
  .row span:first-child { color:var(--text-muted); }
  .row span:last-child { font-variant-numeric:tabular-nums; }

  svg { display:block; width:100%; height:auto; overflow:visible; }
  .tick { fill:var(--text-muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .lbl  { fill:var(--text-primary); font-size:12px; font-weight:550; font-variant-numeric:tabular-nums; }
  .lbl2 { fill:var(--text-muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .gridline { stroke:var(--grid); stroke-width:1; }
  .baseline { stroke:var(--axis); stroke-width:1; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:14px; font-size:12.5px;
            color:var(--text-secondary); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px; }

  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th,td { text-align:right; padding:7px 10px; white-space:nowrap;
          border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
  th:first-child, td:first-child { text-align:left; }
  thead th { color:var(--text-muted); font-weight:550; font-size:12px; }
  td.unmapped { color:var(--text-muted); }
  .key { color:var(--text-secondary); font-size:12px; }

  .tip { position:fixed; pointer-events:none; opacity:0; transition:opacity .1s;
         background:var(--surface-1); border:1px solid var(--border); border-radius:8px;
         padding:9px 11px; font-size:12.5px; box-shadow:0 4px 18px rgba(0,0,0,.16); z-index:9;
         font-variant-numeric:tabular-nums; max-width:280px; }
  .tip b { display:block; margin-bottom:5px; font-size:12px; }
  .tip .tr { display:flex; gap:14px; justify-content:space-between; }
  .empty { color:var(--text-muted); font-size:13px; padding:28px 0; text-align:center; }
  .note { font-size:12px; color:var(--text-muted); margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Windmill AC</h1>
    <span class="meta" id="meta">loading…</span>
  </header>

  <div class="toolbar">
    <div class="presets" id="presets"></div>
    <span class="field">
      <input type="date" id="from"> <span>to</span> <input type="date" id="to">
      <button class="ghost" id="apply">Apply</button>
    </span>
    <span class="field" style="margin-left:auto">
      $<input type="number" id="rate" step="0.001" min="0"> / kWh
    </span>
    <button class="ghost" id="repairBtn"
      title="Fetch any history Windmill still has, then reconstruct only hours a unit ran without reporting">
      Repair gaps</button>
  </div>

  <div class="stats" id="stats"></div>

  <section>
    <h2 id="energyTitle">Energy by unit</h2>
    <p class="sub" id="energySub"></p>
    <div id="barChart"></div>
  </section>

  <section>
    <h2 id="trendTitle">Over time</h2>
    <p class="sub" id="trendSub"></p>
    <div id="trendChart"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <h2>Units</h2>
    <p class="sub" id="unitsSub"></p>
    <div class="cards" id="cards"></div>
  </section>

  <section id="tempSection">
    <h2 id="tempTitle">Temperature</h2>
    <p class="sub" id="tempSub"></p>
    <div id="tempChart"></div>
    <div class="legend">
      <span><i style="background:var(--s2)"></i>Outdoor</span>
      <span><i style="background:var(--s1)"></i>Indoor (average of units)</span>
      <span><i style="background:var(--text-muted);opacity:.5"></i>Target</span>
    </div>
  </section>

  <section id="compareSection" hidden>
    <h2 id="compareTitle">Before vs after</h2>
    <div class="stats" id="paybackStats" style="margin-bottom:16px"></div>
    <p class="sub" id="compareSub"></p>
    <div class="scroll" id="compareTable"></div>
    <h2 id="curveTitle" style="margin-top:26px">Days needed to pay off</h2>
    <p class="sub" id="curveSub"></p>
    <div class="scroll" id="curveTable"></div>
    <p class="note" id="compareNote"></p>
  </section>

  <section>
    <h2>All metrics</h2>
    <p class="sub">Live values for every datastream each unit reports. Named rows are
      confirmed; the rest are undocumented and shown raw.</p>
    <div class="scroll" id="table"></div>
    <p class="note" id="coverage"></p>
  </section>
</div>
<div class="tip" id="tip"></div>

<script>
const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7'];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorOf = i => css(SERIES[i % SERIES.length]);

// Names are Windmill's own, read from the CSV export headers; the pin each one
// binds to was established by correlating exported values against live reads.
const PIN_LABELS = {
  v0:'Power Switch', v1:'Room Temperature (°F)', v2:'Set Temperature (°F)',
  v3:'Mode', v4:'Fan Speed', v7:'Filter Runtime (h)', v15:'Power (W)',
  v16:'Energy (kWh, last 15 min)', v30:'WiFi RSSI (dBm)',
  v31:'Protocol Failure Count'
};
const PIN_FMT = {
  v0: v => v==1 ? 'On' : 'Off',
  v3: v => ({0:'Fan',1:'Cool',2:'Eco'}[v] ?? v),
  v4: v => ({0:'Auto',1:'Low',2:'Medium',3:'High'}[v] ?? v),
};
const PRESETS = [['today','Today'],['24h','24h'],['7d','7 days'],['30d','30 days'],
                 ['mtd','Month'],['ytd','Year'],['12mo','12 mo']];

let state = { range:'today', from:null, to:null, data:null };
let tempLegend = '', outdoorAt = null;

const fmt = (n,d=0) => n==null ? '–' :
  Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const clock = ts => new Date(ts*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const dayLbl = ts => new Date(ts*1000).toLocaleDateString([],{month:'short',day:'numeric'});
const dur = m => m>=60 ? `${Math.floor(m/60)}h ${Math.round(m%60)}m` : `${Math.round(m)}m`;
const isoDay = ts => new Date(ts*1000).toLocaleDateString('en-CA');

const tip = document.getElementById('tip');
function showTip(evt, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = evt.clientX+14, y = evt.clientY+14;
  if (x + r.width  > innerWidth  - 8) x = evt.clientX - r.width  - 14;
  if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - 14;
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
const hideTip = () => tip.style.opacity = 0;

/* ---------------- toolbar ---------------- */
document.getElementById('presets').innerHTML = PRESETS.map(([k,l]) =>
  `<button data-range="${k}" aria-pressed="false">${l}</button>`).join('');
document.getElementById('presets').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state = { ...state, range:b.dataset.range, from:null, to:null };
  load();
});
document.getElementById('apply').addEventListener('click', () => {
  const f = document.getElementById('from').value, t = document.getElementById('to').value;
  if (!f || !t) return;
  state = { ...state, range:null,
            from: new Date(f+'T00:00:00').getTime()/1000,
            to:   new Date(t+'T23:59:59').getTime()/1000 };
  load();
});
document.getElementById('rate').addEventListener('change', async e => {
  const v = parseFloat(e.target.value);
  if (!(v >= 0)) return;
  await fetch('/api/rate?set=' + v);
  load();
});
document.getElementById('repairBtn').addEventListener('click', async e => {
  e.target.disabled = true; e.target.textContent = 'Repairing…';
  try {
    const r = await (await fetch('/api/repair')).json();
    const res = r.results || [];
    const real = res.reduce((a,x) => a + (x.recovered||0), 0);
    const est  = res.reduce((a,x) => a + (x.estimated||0), 0);
    const left = res.reduce((a,x) => a + (x.missing_after||0), 0);
    e.target.textContent = real||est ? `+${real}h real, +${est}h est`
                                     : (left ? `${left}h still missing` : 'No gaps');
  } catch { e.target.textContent = 'Failed'; }
  setTimeout(() => { e.target.disabled = false; e.target.textContent = 'Repair gaps'; }, 4000);
  load();
});

/* ---------------- stats ---------------- */
function renderStats(d) {
  const t = d.totals, days = d.range.span/86400;
  document.getElementById('stats').innerHTML = [
    ['Energy used', fmt(t.kwh, t.kwh<10?2:1), 'kWh', d.range.label.toLowerCase()],
    ['Cost', '$'+fmt(t.cost,2), '', `at $${d.rate.toFixed(3)}/kWh`],
    ['Average per day', fmt(t.daily_avg_kwh,2), 'kWh', `over ${fmt(days,days<3?1:0)} days`],
    ['Drawing now', fmt(t.watts), 'W', `${t.online} of ${t.count} units online`],
  ].map(([k,v,u,n]) => `<div class="stat"><div class="k">${k}</div>
      <div class="v">${v}${u?`<span class="u">${u}</span>`:''}</div>
      <div class="n">${n}</div></div>`).join('');
}

/* ---------------- bars: energy by unit ---------------- */
function renderBars(d) {
  const el = document.getElementById('barChart');
  const units = [...d.units].sort((a,b) => (b.kwh ?? -1) - (a.kwh ?? -1));
  const max = Math.max(...units.map(u => u.kwh ?? 0), .001);
  const idx = new Map(d.units.map((u,i) => [u.name,i]));
  const W = 900, rowH = 34, padL = 138, padR = 150, plot = W - padL - padR;
  const H = units.length * rowH + 8;

  const bars = units.map((u,i) => {
    const y = i*rowH + 6, c = colorOf(idx.get(u.name));
    if (!u.complete) return `<g class="bar" data-name="${u.name}">
      <rect x="0" y="${y-6}" width="${W}" height="${rowH}" fill="transparent"></rect>
      <text class="lbl" x="${padL-12}" y="${y+13}" text-anchor="end"
        style="opacity:.5">${u.name}</text>
      <rect x="${padL}" y="${y}" width="${plot}" height="18" rx="4" fill="none"
        stroke="${c}" stroke-width="1" stroke-dasharray="3 3" opacity=".45"></rect>
      <text class="lbl2" x="${padL+10}" y="${y+13}">no data — ${fmt(u.missing_h)}h missing</text>
    </g>`;
    const w = Math.max(2, (u.kwh/max)*plot);
    return `<g class="bar" data-name="${u.name}">
      <rect x="0" y="${y-6}" width="${W}" height="${rowH}" fill="transparent"></rect>
      <text class="lbl" x="${padL-12}" y="${y+13}" text-anchor="end">${u.name}</text>
      <rect x="${padL}" y="${y}" width="${w}" height="18" rx="4" fill="${c}"></rect>
      <text class="lbl" x="${padL+w+8}" y="${y+13}">${fmt(u.kwh,2)} kWh</text>
      <text class="lbl2" x="${W}" y="${y+13}" text-anchor="end">$${fmt(u.cost,2)} · ${fmt(u.share,1)}%</text>
    </g>`;
  }).join('');

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Energy used by unit">${bars}</svg>`;

  el.querySelectorAll('.bar').forEach(g => {
    const u = units.find(x => x.name === g.dataset.name);
    g.addEventListener('mousemove', e => showTip(e, `<b>${u.name}</b>
      ${u.complete ? '' : `<div class="tr"><span>History</span><span>${fmt(u.missing_h)}h missing</span></div>`}
      <div class="tr"><span>Energy</span><span>${u.complete?fmt(u.kwh,3)+' kWh':'no data'}</span></div>
      ${u.est_kwh>0.01?`<div class="tr"><span>of which estimated</span>
        <span>${fmt(u.est_kwh,2)} kWh (${fmt(u.est_share,0)}%)</span></div>
        <div class="tr"><span>estimated by</span><span>${(u.est_methods||[]).join(', ')}</span></div>`:''}
      <div class="tr"><span>Cost</span><span>$${fmt(u.cost,2)}</span></div>
      <div class="tr"><span>Share</span><span>${fmt(u.share,1)}%</span></div>
      <div class="tr"><span>Compressor</span><span>${dur(u.cooling_min)}</span></div>
      <div class="tr"><span>Peak draw</span><span>${fmt(u.peak_w)} W</span></div>`));
    g.addEventListener('mouseleave', hideTip);
  });

  document.getElementById('energyTitle').textContent = `Energy by unit — ${d.range.label}`;
  const inc = d.totals.incomplete || [];
  document.getElementById('energySub').textContent =
    `${fmt(d.totals.kwh,2)} kWh total, $${fmt(d.totals.cost,2)}. Ranked highest first.`
    + (inc.length ? `  ${inc.join(', ')} ${inc.length>1?'have':'has'} no history for this `
      + `range and ${inc.length>1?'are':'is'} excluded from the total.` : '')
    + (d.totals.est_kwh > 0.01
        ? `  ${fmt(d.totals.est_kwh,1)} kWh of this is reconstructed for hours `
        + `${(d.totals.estimated_units||[]).join(', ')} ran without reporting.` : '');
}

/* Outdoor temperature as a background wash.

   Deliberately NOT a second y-axis: with two scales, whether the curves appear
   to track each other is set by the scaling, not the data. Encoding temperature
   as background intensity keeps one axis and cannot manufacture a crossing. */
function tempBackdrop(d, xOf, wOf, yTop, yBot) {
  const tp = d.temps;
  if (!tp || !tp.t.length) return {svg:'', lo:null, hi:null};
  const byHour = new Map();
  tp.t.forEach((ts,i) => { if (tp.outdoor[i]!=null) byHour.set(ts, tp.outdoor[i]); });
  if (!byHour.size) return {svg:'', lo:null, hi:null};
  const at = ts => {
    if (byHour.has(ts)) return byHour.get(ts);
    let best=null, bd=Infinity;
    for (const [k,v] of byHour) { const dd=Math.abs(k-ts); if (dd<bd){bd=dd;best=v;} }
    return bd <= (tp.bucket||3600)*1.5 ? best : null;
  };
  const vals=[...byHour.values()], lo=Math.min(...vals), hi=Math.max(...vals);
  const c = css('--s2');
  const rects = d.series.t.map((ts,i) => {
    const v = at(ts); if (v==null) return '';
    const n = hi>lo ? (v-lo)/(hi-lo) : .5;
    return `<rect x="${xOf(i)}" y="${yTop}" width="${wOf(i)}" height="${yBot-yTop}"
      fill="${c}" fill-opacity="${(0.04 + n*0.20).toFixed(3)}"></rect>`;
  }).join('');
  return {svg:`<g aria-hidden="true">${rects}</g>`, lo, hi, at};
}

function tempScaleLegend(lo, hi) {
  if (lo==null) return '';
  const c = css('--s2');
  const steps = Array.from({length:5},(_,i)=>i/4);
  return `<span style="display:inline-flex;align-items:center;gap:6px">
    <span>${fmt(lo,0)}°F</span>
    ${steps.map(n=>`<i style="width:14px;height:9px;border-radius:0;background:${c};
      opacity:${(0.04+n*0.20)/0.24}"></i>`).join('')}
    <span>${fmt(hi,0)}°F outdoor</span></span>`;
}

/* ---------------- trend: stacked kWh bars, or watt lines ---------------- */
function renderTrend(d) {
  const el = document.getElementById('trendChart');
  const s = d.series, names = Object.keys(s.units);
  const setLegend = () => document.getElementById('legend').innerHTML =
    names.map((n,i) => `<span><i style="background:${colorOf(i)}"></i>${n}</span>`).join('')
    + (tempLegend ? tempLegend : '');

  if (!s.t.length || (s.unit==='W' && s.t.length < 2)) {
    tempLegend = ''; setLegend();
    el.innerHTML = `<div class="empty">No data in this range yet.</div>`;
    document.getElementById('trendSub').textContent = '';
    return;
  }
  tempLegend = '';
  const W = 900, H = 280, padL = 52, padR = 12, padT = 10, padB = 28;
  const x0 = padL, x1 = W - padR, y0 = H - padB, y1 = padT;

  if (s.unit === 'W') return renderLines(d, el, {W,H,padL,padR,padT,padB}, setLegend);

  /* stacked bars: one bucket per column */
  const totals = s.t.map((_,i) => names.reduce((a,n) => a + (s.units[n][i]||0), 0));
  const yMax = Math.max(...totals, .001);
  const bw = Math.max(2, (x1-x0)/s.t.length - 2);
  const yOf = v => y0 - (v/yMax)*(y0-y1);

  const ticks = [0,.25,.5,.75,1].map(f => yMax*f);
  const grid = ticks.map(v => `
    <line class="gridline" x1="${x0}" x2="${x1}" y1="${yOf(v)}" y2="${yOf(v)}"></line>
    <text class="tick" x="${x0-8}" y="${yOf(v)+4}" text-anchor="end">${fmt(v, yMax<2?2:1)}</text>`).join('');

  const cols = s.t.map((ts,i) => {
    const cx = x0 + (i+.5)*((x1-x0)/s.t.length);
    let acc = 0;
    const segs = names.map((n,k) => {
      const v = s.units[n][i] || 0;
      if (v <= 0) return '';
      const top = yOf(acc+v), bot = yOf(acc); acc += v;
      const h = Math.max(1, bot-top-2);   // 2px surface gap between segments
      return `<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${h}"
        rx="${h>4?2:0}" fill="${colorOf(k)}"></rect>`;
    }).join('');
    return `<g class="col" data-i="${i}">
      <rect x="${cx-((x1-x0)/s.t.length)/2}" y="${y1}" width="${(x1-x0)/s.t.length}"
        height="${y0-y1}" fill="transparent"></rect>${segs}</g>`;
  }).join('');

  const step = Math.ceil(s.t.length/7);
  const xlabels = s.t.map((ts,i) => i % step ? '' :
    `<text class="tick" x="${x0+(i+.5)*((x1-x0)/s.t.length)}" y="${H-8}"
      text-anchor="middle">${s.bucket >= 86400 ? dayLbl(ts)
        : dayLbl(ts)+' '+clock(ts)}</text>`).join('');

  const slot = (x1-x0)/s.t.length;
  const bd = tempBackdrop(d, i => x0 + i*slot, () => slot, y1, y0);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Energy per period by unit, shaded by outdoor temperature">
    ${bd.svg}${grid}${cols}${xlabels}
    <line class="baseline" x1="${x0}" x2="${x1}" y1="${y0}" y2="${y0}"></line>
    <text class="tick" x="${x0-8}" y="${y1-2}" text-anchor="end">kWh</text></svg>`;

  el.querySelectorAll('.col').forEach(g => {
    const i = +g.dataset.i;
    const rows = names.map((n,k) => ({n, v:s.units[n][i]||0, k}))
                      .filter(r => r.v > 0).sort((a,b) => b.v-a.v);
    g.addEventListener('mousemove', e => showTip(e,
      `<b>${dayLbl(s.t[i])}${s.bucket < 86400 ? ' '+clock(s.t[i]) : ''}</b>` +
      rows.map(r => `<div class="tr"><span><i style="display:inline-block;width:8px;
        height:8px;border-radius:2px;margin-right:6px;background:${colorOf(r.k)}"></i>${r.n}</span>
        <span>${fmt(r.v,2)} kWh</span></div>`).join('') +
      `<div class="tr" style="margin-top:5px;border-top:1px solid var(--border);padding-top:5px">
        <span>Total</span><span>${fmt(totals[i],2)} kWh · $${fmt(totals[i]*d.rate,2)}</span></div>`
      + (outdoorAt && outdoorAt(s.t[i])!=null
          ? `<div class="tr"><span>Outdoor</span><span>${fmt(outdoorAt(s.t[i]),1)}°F</span></div>` : '')));
    g.addEventListener('mouseleave', hideTip);
  });

  const per = s.bucket>=604800 ? 'week' : s.bucket>=86400 ? 'day' : s.bucket>=21600 ? '6 hours' : 'hour';
  document.getElementById('trendTitle').textContent = `Energy over time — ${d.range.label}`;
  document.getElementById('trendSub').textContent =
    `kWh per ${per}, stacked by unit, shaded by outdoor temperature. `
  + `Built from the ${d.resolution}.`;
  tempLegend = tempScaleLegend(bd.lo, bd.hi);
  if (bd.at) outdoorAt = bd.at;
  setLegend();
}

function renderLines(d, el, g, setLegend) {
  const s = d.series, names = Object.keys(s.units), t = s.t;
  const {W,H,padL,padR,padT,padB} = g;
  const maxW = Math.max(10, ...names.flatMap(n => s.units[n].filter(v => v!=null)));
  const yMax = Math.ceil(maxW/100)*100 || 100;
  const X = i => padL + (i/(t.length-1))*(W-padL-padR);
  const Y = v => padT + (1 - v/yMax)*(H-padT-padB);
  const ticks = [0,.25,.5,.75,1].map(f => Math.round(yMax*f));
  const grid = ticks.map(v => `
    <line class="gridline" x1="${padL}" x2="${W-padR}" y1="${Y(v)}" y2="${Y(v)}"></line>
    <text class="tick" x="${padL-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('');
  const n = Math.min(6, t.length);
  const times = Array.from({length:n},(_,k)=>Math.round(k*(t.length-1)/(n-1)))
    .map(i => `<text class="tick" x="${X(i)}" y="${H-6}" text-anchor="middle">${clock(t[i])}</text>`).join('');
  const paths = names.map((nm,i) => {
    let dstr='', pen=false;
    s.units[nm].forEach((v,j) => {
      if (v==null) { pen=false; return; }
      dstr += (pen?'L':'M') + X(j).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; pen=true;
    });
    return `<path d="${dstr}" fill="none" stroke="${colorOf(i)}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"></path>`;
  }).join('');

  const step2 = t.length>1 ? (W-padL-padR)/(t.length-1) : (W-padL-padR);
  const bd = tempBackdrop(d, i => X(i)-step2/2, () => step2, padT, H-padB);
  tempLegend = tempScaleLegend(bd.lo, bd.hi);
  outdoorAt = bd.at || null;
  if (setLegend) setLegend();
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Power draw over time, shaded by outdoor temperature">
    ${bd.svg}${grid}${times}
    <line class="baseline" x1="${padL}" x2="${W-padR}" y1="${Y(0)}" y2="${Y(0)}"></line>
    ${paths}
    <g id="cross" style="display:none">
      <line class="baseline" y1="${padT}" y2="${H-padB}" stroke-dasharray="3 3"></line>
      ${names.map((_,i)=>`<circle r="4" fill="${colorOf(i)}" stroke="var(--surface-1)"
        stroke-width="2"></circle>`).join('')}
    </g>
    <rect x="${padL}" y="${padT}" width="${W-padL-padR}" height="${H-padT-padB}"
      fill="transparent" id="hit"></rect>
    <text class="tick" x="${padL-8}" y="${padT-2}" text-anchor="end">W</text></svg>`;

  const svg = el.querySelector('svg'), cross = el.querySelector('#cross');
  const vline = cross.querySelector('line'), dots = [...cross.querySelectorAll('circle')];
  el.querySelector('#hit').addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect();
    const sx = (e.clientX-r.left)/r.width*W;
    const i = Math.max(0, Math.min(t.length-1,
      Math.round((sx-padL)/(W-padL-padR)*(t.length-1))));
    cross.style.display='';
    vline.setAttribute('x1',X(i)); vline.setAttribute('x2',X(i));
    const rows = names.map((nm,k) => {
      const v = s.units[nm][i];
      dots[k].style.display = v==null ? 'none' : '';
      if (v!=null) { dots[k].setAttribute('cx',X(i)); dots[k].setAttribute('cy',Y(v)); }
      return v==null ? null : {nm,v,k};
    }).filter(Boolean).sort((a,b)=>b.v-a.v);
    showTip(e, `<b>${clock(t[i])}</b>` + rows.map(r =>
      `<div class="tr"><span><i style="display:inline-block;width:8px;height:8px;
        border-radius:2px;margin-right:6px;background:${colorOf(r.k)}"></i>${r.nm}</span>
        <span>${fmt(r.v)} W</span></div>`).join(''));
  });
  el.querySelector('#hit').addEventListener('mouseleave', () => {
    cross.style.display='none'; hideTip();
  });

  document.getElementById('trendTitle').textContent = `Power draw — ${d.range.label}`;
  document.getElementById('trendSub').textContent =
    'Watts per unit. Flat and low is idle; the steps are compressor cycles.';
}

/* ---------------- cards + table ---------------- */
function renderCards(d) {
  document.getElementById('unitsSub').textContent =
    `${d.totals.online} of ${d.totals.count} reporting. Energy figures cover ${d.range.label.toLowerCase()}.`;
  document.getElementById('cards').innerHTML = d.units.map((u,i) => {
    const off = !u.online;
    const st = off ? 'Offline' : (u.on ? `${u.mode} · fan ${u.fan}` : 'Off');
    const mostly = u.complete && u.est_share > 50;
    return `<div class="card" style="${off?'opacity:.55':''}">
      <div class="top"><span class="swatch" style="background:${colorOf(i)}"></span>
        <span class="nm">${u.name}</span><span class="pill">${st}</span></div>
      <div class="temps"><span class="now">${u.temp==null?'–':fmt(u.temp)}°</span>
        <span class="tgt">set to ${u.target==null?'–':fmt(u.target)}°</span></div>
      <div class="rows">
        <div class="row"><span>Drawing now</span><span>${fmt(u.watts)} W</span></div>
        <div class="row"><span>Energy</span><span>${u.complete
          ? fmt(u.kwh,2)+' kWh'+(mostly?' *':'') : 'no data'}</span></div>
        ${mostly?`<div class="row"><span style="font-size:11.5px">* ${fmt(u.est_share,0)}% estimated
          (${(u.est_methods||[]).join(', ')})</span><span></span></div>`:''}
        <div class="row"><span>Cost</span><span>${u.complete?'$'+fmt(u.cost,2):'–'}</span></div>
        <div class="row"><span>Compressor</span><span>${u.complete?dur(u.cooling_min):'–'}</span></div>
        <div class="row"><span>Share</span><span>${u.complete?fmt(u.share,1)+'%':'–'}</span></div>
      </div></div>`;
  }).join('');
}

function renderTable(d) {
  const units = d.units;
  const pins = [...new Set(units.flatMap(u => Object.keys(u.pins)))]
    .sort((a,b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));
  const derived = [
    ['Energy (kWh)', u => u.complete?fmt(u.kwh,3):'no data', fmt(d.totals.kwh,3)],
    ['Cost', u => u.complete?'$'+fmt(u.cost,2):'–', '$'+fmt(d.totals.cost,2)],
    ['Compressor time', u => u.complete?dur(u.cooling_min):'–', dur(d.totals.cooling_min)],
    ['Peak draw (W)', u => fmt(u.peak_w), '–'],
    ['Share of total', u => u.complete?fmt(u.share,1)+'%':'–', '100%'],
    ['History coverage', u => fmt(u.coverage*100,0)+'%', '–'],
    ['of which reconstructed', u => u.est_kwh>0.01
        ? `${fmt(u.est_kwh,2)} kWh (${fmt(u.est_share,0)}%)` : '–',
      d.totals.est_kwh>0.01?fmt(d.totals.est_kwh,2)+' kWh':'–'],
    ['estimate method', u => (u.est_methods||[]).join(', ') || '–', '–'],
  ];
  document.getElementById('table').innerHTML = `<table>
    <thead><tr><th>Metric</th>${units.map(u=>`<th>${u.name}</th>`).join('')}<th>Total</th></tr></thead>
    <tbody>
      ${derived.map(([l,f,tot]) => `<tr><td class="key">${l}</td>
        ${units.map(u=>`<td>${f(u)}</td>`).join('')}<td>${tot}</td></tr>`).join('')}
      <tr><td colspan="${units.length+2}" style="padding-top:16px;color:var(--text-muted);
        font-size:12px">Live datastreams</td></tr>
      ${pins.map(p => {
        const known = PIN_LABELS[p];
        const label = known ? `${known} <span style="opacity:.5">${p.toUpperCase()}</span>`
                            : `<span style="opacity:.7">${p.toUpperCase()}</span> unmapped`;
        return `<tr><td class="key">${label}</td>${units.map(u => {
          const v = u.pins[p];
          if (v === undefined) return `<td class="unmapped">–</td>`;
          const shown = PIN_FMT[p] ? PIN_FMT[p](v)
            : (typeof v==='number' ? fmt(v, Number.isInteger(v)?0:3) : v);
          return `<td class="${known?'':'unmapped'}">${shown}</td>`;
        }).join('')}<td class="unmapped">–</td></tr>`;
      }).join('')}
    </tbody></table>`;
}

/* ---------------- temperature vs energy ---------------- */
function renderTemps(d) {
  const el = document.getElementById('tempChart');
  const tp = d.temps, sec = document.getElementById('tempSection');
  if (!tp || tp.t.length < 2) {
    sec.hidden = true; return;
  }
  sec.hidden = false;
  const t = tp.t;
  const vals = [...tp.indoor, ...tp.outdoor].filter(v => v != null);
  const lo = Math.floor(Math.min(...vals)/5)*5, hi = Math.ceil(Math.max(...vals)/5)*5;
  const W = 900, H = 240, padL = 46, padR = 12, padT = 10, padB = 28;
  const X = i => padL + (i/(t.length-1))*(W-padL-padR);
  const Y = v => padT + (1 - (v-lo)/(hi-lo || 1))*(H-padT-padB);

  const ticks = [0,.25,.5,.75,1].map(f => Math.round(lo + (hi-lo)*f));
  const grid = ticks.map(v => `
    <line class="gridline" x1="${padL}" x2="${W-padR}" y1="${Y(v)}" y2="${Y(v)}"></line>
    <text class="tick" x="${padL-8}" y="${Y(v)+4}" text-anchor="end">${v}°</text>`).join('');

  const line = (arr, color, width) => {
    let s='', pen=false;
    arr.forEach((v,i) => {
      if (v==null) { pen=false; return; }
      s += (pen?'L':'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; pen=true;
    });
    return `<path d="${s}" fill="none" stroke="${color}" stroke-width="${width}"
      stroke-linejoin="round" stroke-linecap="round"></path>`;
  };

  const n = Math.min(7, t.length);
  const xl = Array.from({length:n},(_,k)=>Math.round(k*(t.length-1)/(n-1)))
    .map(i => `<text class="tick" x="${X(i)}" y="${H-8}" text-anchor="middle">${
      tp.bucket>=86400 ? dayLbl(t[i]) : dayLbl(t[i])+' '+clock(t[i])}</text>`).join('');

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Indoor and outdoor temperature over time">
    ${grid}${xl}
    <line class="baseline" x1="${padL}" x2="${W-padR}" y1="${H-padB}" y2="${H-padB}"></line>
    ${line(tp.outdoor, css('--s2'), 2)}
    ${line(tp.indoor, css('--s1'), 2)}
    <g id="tcross" style="display:none">
      <line class="baseline" y1="${padT}" y2="${H-padB}" stroke-dasharray="3 3"></line>
      <circle r="4" fill="${css('--s2')}" stroke="var(--surface-1)" stroke-width="2"></circle>
      <circle r="4" fill="${css('--s1')}" stroke="var(--surface-1)" stroke-width="2"></circle>
    </g>
    <rect x="${padL}" y="${padT}" width="${W-padL-padR}" height="${H-padT-padB}"
      fill="transparent" id="thit"></rect>
    <text class="tick" x="${padL-8}" y="${padT-2}" text-anchor="end">°F</text></svg>`;

  const svg = el.querySelector('svg'), cr = el.querySelector('#tcross');
  const vl = cr.querySelector('line'), dots=[...cr.querySelectorAll('circle')];
  const energyAt = new Map(d.series.t.map((ts,i) =>
    [ts, Object.keys(d.series.units).reduce((a,n2)=>a+(d.series.units[n2][i]||0),0)]));
  el.querySelector('#thit').addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect();
    const sx = (e.clientX-r.left)/r.width*W;
    const i = Math.max(0, Math.min(t.length-1,
      Math.round((sx-padL)/(W-padL-padR)*(t.length-1))));
    cr.style.display=''; vl.setAttribute('x1',X(i)); vl.setAttribute('x2',X(i));
    [tp.outdoor[i], tp.indoor[i]].forEach((v,k) => {
      dots[k].style.display = v==null?'none':'';
      if (v!=null){ dots[k].setAttribute('cx',X(i)); dots[k].setAttribute('cy',Y(v)); }
    });
    const kwh = energyAt.get(t[i]);
    const spread = (tp.outdoor[i]!=null && tp.indoor[i]!=null)
      ? tp.outdoor[i]-tp.indoor[i] : null;
    showTip(e, `<b>${dayLbl(t[i])}${tp.bucket<86400?' '+clock(t[i]):''}</b>
      <div class="tr"><span>Outdoor</span><span>${fmt(tp.outdoor[i],1)}°F</span></div>
      <div class="tr"><span>Indoor</span><span>${fmt(tp.indoor[i],1)}°F</span></div>
      ${spread!=null?`<div class="tr"><span>Difference</span><span>${fmt(spread,1)}°F</span></div>`:''}
      ${kwh!=null?`<div class="tr" style="margin-top:5px;border-top:1px solid var(--border);
        padding-top:5px"><span>Energy</span><span>${fmt(kwh,2)} kWh</span></div>`:''}`);
  });
  el.querySelector('#thit').addEventListener('mouseleave', () => {
    cr.style.display='none'; hideTip();
  });

  // correlation between outdoor temperature and energy, same buckets
  const pairs = t.map((ts,i) => [tp.outdoor[i], energyAt.get(ts)])
                 .filter(([a,b]) => a!=null && b!=null);
  let corr = null;
  if (pairs.length > 4) {
    const n2=pairs.length, mx=pairs.reduce((a,p)=>a+p[0],0)/n2, my=pairs.reduce((a,p)=>a+p[1],0)/n2;
    const cov=pairs.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/n2;
    const sx=Math.sqrt(pairs.reduce((a,p)=>a+(p[0]-mx)**2,0)/n2);
    const sy=Math.sqrt(pairs.reduce((a,p)=>a+(p[1]-my)**2,0)/n2);
    if (sx>0 && sy>0) corr = cov/(sx*sy);
  }
  const per = tp.bucket>=604800?'week':tp.bucket>=86400?'day':tp.bucket>=21600?'6 hours':'hour';
  document.getElementById('tempTitle').textContent = `Temperature — ${d.range.label}`;
  document.getElementById('tempSub').textContent =
    `Outdoor vs the average indoor reading across units, per ${per}, on the same time axis `
  + `as the energy chart above.`
  + (corr!=null ? `  Outdoor temperature and energy use correlate at r = ${fmt(corr,2)}.` : '');
}

/* ---------------- before vs after ---------------- */
function renderCompare(c) {
  const sec = document.getElementById('compareSection');
  if (!c || !c.available) {
    sec.hidden = true;
    if (c && c.reason) document.getElementById('compareNote').textContent = c.reason;
    return;
  }
  sec.hidden = false;
  const money = v => (v<0?'−':'+') + '$' + fmt(Math.abs(v),2);
  const band = (lo,hi) => Math.abs(hi-lo) < 0.005 ? money(lo) : `${money(lo)} to ${money(hi)}`;
  const nUnits = c.new_units.length;

  const rows = c.rows.map(r => {
    const cheaper = r.delta_hi < 0;
    return `<tr>
      <td class="key">${fmt(r.mean_f)}°F</td>
      <td class="unmapped">~${fmt(r.mean_f + (c.climate?.high_gap ?? 7))}°F</td>
      <td>${fmt(r.before,1)}</td>
      <td>${fmt(r.after_lo,1)}${r.after_hi!==r.after_lo?'–'+fmt(r.after_hi,1):''}</td>
      <td style="color:${cheaper?'var(--text-primary)':'inherit'}">
        ${band(r.delta_lo*c.rate, r.delta_hi*c.rate)}</td>
      <td>${band(r.delta_lo*c.rate*30, r.delta_hi*c.rate*30)}</td></tr>`;
  }).join('');

  const be = c.breakeven_lo
    ? (c.breakeven_hi && Math.abs(c.breakeven_hi-c.breakeven_lo) > 0.1
        ? `${fmt(c.breakeven_lo,1)}–${fmt(c.breakeven_hi,1)}°F`
        : `${fmt(c.breakeven_lo,1)}°F`)
    : 'never — the newer setup is cheaper at every temperature';

  document.getElementById('compareTable').innerHTML = `<table>
    <thead><tr><th>Daily mean</th><th>≈ that day's high</th><th>Before (kWh)</th>
      <th>After (kWh)</th><th>Extra / day</th><th>Extra / month</th></tr></thead>
    <tbody>${rows}
      <tr><td class="key" colspan="4" style="padding-top:14px">
        <strong>Break-even</strong> — the two setups cost the same at a daily mean of</td>
        <td colspan="2" style="padding-top:14px"><strong>${be}</strong></td></tr>
    </tbody></table>`;

  // headline: how many hot days a season would need for this to pay for itself
  const pb = c.payback;
  if (pb) {
    const tiles = [];
    if (pb.possible) {
      tiles.push(['Hot days needed to break even', fmt(pb.days_needed,1), 'days',
        `at ${fmt(pb.at_f,1)}°F, the hottest on record`]);
      tiles.push(['Your summers actually deliver', fmt(pb.days_available,1), 'days',
        `per season that save money — ` +
        (pb.days_available >= pb.days_needed ? 'enough' : 'not enough')]);
    } else {
      tiles.push(['Hot days needed to break even', 'Never', '',
        `even at ${fmt(pb.at_f,1)}°F it costs ${fmt(pb.delta_at_hottest,1)} kWh more per day`]);
      tiles.push(['Break-even would need', fmt(c.breakeven_lo,0)+'°F', 'daily mean',
        `${fmt(c.breakeven_lo - pb.at_f,0)}°F hotter than anything on record`]);
    }
    tiles.push(['Cost per cooling season', '$'+fmt(pb.season_deficit_cost,0), '',
      `${fmt(pb.season_deficit_kwh,0)} kWh across ${pb.seasons.join(', ')} weather`]);
    document.getElementById('paybackStats').innerHTML = tiles.map(([k,v,u,n]) =>
      `<div class="stat"><div class="k">${k}</div>
        <div class="v">${v}${u?`<span class="u">${u}</span>`:''}</div>
        <div class="n">${n}</div></div>`).join('');
  } else {
    document.getElementById('paybackStats').innerHTML = '';
  }

  document.getElementById('compareTitle').textContent =
    `Before vs after — ${nUnits} unit${nUnits>1?'s':''} added ${c.change}`;
  document.getElementById('compareSub').innerHTML =
    `Daily household kWh regressed on cooling degree days, so weather is controlled for. `
  + `Each degree warmer narrows the gap by about $${fmt(c.per_degree,3)}/day. `
  + `Fits: before <strong>${fmt(c.before.a,1)} + ${fmt(c.before.b,2)}×CDD</strong> `
  + `(n=${c.before.n}, R²=${fmt(c.before.r2,2)}), after `
  + `<strong>${fmt(c.after.a,1)} + ${fmt(c.after.b,2)}×CDD</strong> `
  + `(n=${c.after.n}, R²=${fmt(c.after.r2,2)}).`;

  // how many days above a given temperature a summer would need
  const cv = c.payback_curve;
  if (cv) {
    const rows = cv.rows.map(r => {
      const imp = r.days_needed == null;
      return `<tr${imp?' style="opacity:.62"':''}>
        <td class="key">${fmt(r.temp_f)}°F</td>
        <td>${r.saves_per_day!=null ? fmt(r.saves_per_day,2)+' kWh' : '—'}</td>
        <td>${r.saves_per_day!=null ? '$'+fmt(r.saves_per_day*c.rate,3) : '—'}</td>
        <td>${imp ? 'never' : fmt(r.days_needed)+' days'}</td>
        <td>${imp ? '—' : fmt(r.pct_of_summer)+'%'}</td></tr>`;
    }).join('');
    document.getElementById('curveTable').innerHTML = `<table>
      <thead><tr><th>If a day's mean hits</th><th>It saves</th><th></th>
        <th>Days needed per summer</th><th>Of a ${cv.season_len}-day summer</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
    document.getElementById('curveSub').innerHTML =
      `Take a real summer, replace its hottest days with days at each temperature, and `
    + `find how many it takes for the season to net out. Below `
    + `${fmt(c.breakeven_lo,0)}°F a day costs more rather than less, so no number of `
    + `them ever pays off — those rows read <em>never</em>. `
    + `The hottest daily mean in ${(c.climate?.seasons||[]).join(', ')} was `
    + `<strong>${fmt(cv.hottest_on_record,1)}°F</strong>.`;
  }

  const notes = [];
  if (c.climate) notes.push(
    `In ${c.climate.seasons.join(', ')} local summers, days at or above break-even `
  + `occurred ${fmt(c.climate.days_above_be,1)}× per season `
  + `(hottest daily mean on record ${fmt(c.climate.hottest_mean,1)}°F). `
  + `Net effect over a full cooling season: ${money(c.climate.season_cost)}.`);
  if (c.extrapolated) notes.push(
    `Break-even is extrapolated — it sits above the hottest day in the fit `
  + `(${fmt(c.observed_hi_f,1)}°F daily mean), so treat it as "well beyond anything `
  + `observed" rather than a precise temperature.`);
  if (c.imputed.length) notes.push(
    `${c.imputed.join(', ')} lack${c.imputed.length>1?'':'s'} history for this period, `
  + `so ${c.imputed.length>1?'they are':'it is'} imputed at `
  + `${fmt(c.impute_band[0],1)}–${fmt(c.impute_band[1],1)} kWh/day from sibling units — `
  + `that is the range shown in every figure above.`);
  if (c.estimate_heavy) notes.push(
    `${fmt(c.est_share_after,0)}% of the after period and ${fmt(c.est_share_before,0)}% `
  + `of the before period is reconstructed rather than measured — these figures `
  + `shift when real data replaces it.`);
  const h = c.history || [];
  if (h.length > 1) {
    const first = h[0], last = h[h.length-1];
    notes.push(`Rolling: recomputed on every refresh. Season cost estimate was `
      + `$${fmt(first.season_cost,0)} on ${first.day}, now $${fmt(last.season_cost,0)} `
      + `(${h.length} daily snapshots).`);
  } else {
    notes.push('Rolling: recomputed from the database on every refresh, so these '
      + 'figures sharpen automatically as more days accumulate.');
  }
  if (c.weak) notes.push(
    `Thin fit (n=${c.before.n} before, ${c.after.n} after). Directional only; `
  + `it sharpens as more days accumulate.`);
  document.getElementById('compareNote').innerHTML = notes.join('<br>');
}

/* ---------------- load ---------------- */
async function load() {
  const q = state.range ? `range=${state.range}`
                        : `from=${Math.floor(state.from)}&to=${Math.floor(state.to)}`;
  try {
    const d = await (await fetch('/api/summary?'+q)).json();
    if (d.error) throw new Error(d.error);
    state.data = d;
    document.querySelectorAll('#presets button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.range === state.range)));
    const rateEl = document.getElementById('rate');
    if (document.activeElement !== rateEl) rateEl.value = d.rate;
    if (!document.getElementById('from').value) {
      document.getElementById('from').value = isoDay(d.range.from);
      document.getElementById('to').value = isoDay(d.range.to);
    }
    renderStats(d); renderBars(d); renderTrend(d); renderTemps(d);
    renderCards(d); renderTable(d);
    fetch('/api/comparison').then(r => r.json()).then(renderCompare).catch(() => {});
    document.getElementById('meta').innerHTML =
      `<span class="dot"></span> live · updated ${clock(d.updated)}`;
    document.getElementById('coverage').textContent = d.coverage.start
      ? `History starts ${new Date(d.coverage.start*1000).toLocaleString()}. `
      + `Windmill retains 30 days; everything older accumulates here only while serve.py runs.`
      : 'No history stored yet.';
  } catch (e) {
    document.getElementById('meta').textContent = 'error: ' + e.message;
  }
}
load();
setInterval(() => { if (!document.hidden) load(); }, 30000);
</script>
</body>
</html>
